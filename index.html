<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="register-box">
        <h1>用户注册</h1>
        <form id="register-form">
            <div class="form-item">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" maxlength="20" required>
            </div>
            <div class="form-item">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="请输入邮箱" autocomplete="email" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入至少6位密码" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="form-item">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" placeholder="请再次输入密码" autocomplete="new-password" required>
            </div>
            <p id="message" role="status" aria-live="polite"></p>
            <button type="submit">注册</button>
        </form>
    </main>
</body>
</html>
